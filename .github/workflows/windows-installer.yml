name: Windows installation package
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v5
      - name: Read and validate release version
        id: release-version
        shell: pwsh
        run: |
          $amicusVersion = (Get-Content VERSION -Raw).Trim()
          if ($amicusVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $amicusVersion" }
          $database = Get-Content backend/database.py -Raw
          $installer = Get-Content windows/AmicusTheologi.iss -Raw
          if (-not $database.Contains("APP_VERSION = '$amicusVersion'")) { throw 'backend/database.py version differs from VERSION' }
          if (-not $installer.Contains("#define AppVersion `"$amicusVersion`"")) { throw 'Inno Setup AppVersion differs from VERSION' }
          if (-not $installer.Contains("OutputBaseFilename=Amicus-Theologi-Setup-$amicusVersion")) { throw 'Inno Setup output filename differs from VERSION' }
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$' -and $Matches[1] -ne $amicusVersion) { throw 'Git tag and VERSION do not match' }
          "version=$amicusVersion" >> $env:GITHUB_OUTPUT
          "AMICUS_VERSION=$amicusVersion" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Check source and JavaScript
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node --check frontend/app.js
          node --check frontend/editions.js
          node --check frontend/wordtools.js
          node --check frontend/workflow.js
          node --check frontend/release1.js
          node --check ANLEITUNG.js
      - name: Build & test real Windows exe; create installer
        shell: pwsh
        run: ./windows/build_windows.ps1
      - name: Pack portable Windows distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_installer | Out-Null
          Compress-Archive -Path 'dist/AmicusTheologi/*' -DestinationPath "dist_installer/Amicus-Theologi-Portable-$env:AMICUS_VERSION.zip" -Force
      - uses: actions/upload-artifact@v6
        with:
          name: Amicus-Theologi-${{ steps.release-version.outputs.version }}-Windows-Installer
          path: dist_installer/*
          if-no-files-found: error
