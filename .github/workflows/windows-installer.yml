name: Windows installation package
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Check source and JavaScript
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node --check frontend/app.js
          node --check frontend/editions.js
          node --check frontend/wordtools.js
          node --check frontend/workflow.js
          node --check frontend/release1.js
          node --check ANLEITUNG.js
      - name: Build & test real Windows exe; create installer
        shell: pwsh
        run: ./windows/build_windows.ps1
      - name: Pack portable Windows distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_installer | Out-Null
          Compress-Archive -Path 'dist/AmicusTheologi/*' -DestinationPath 'dist_installer/Amicus-Theologi-Portable-1.0.8.zip' -Force
      - uses: actions/upload-artifact@v6
        with:
          name: Amicus-Theologi-1.0.8-Windows-Installer
          path: dist_installer/*
          if-no-files-found: error
